openapi: 3.1.0
info:
  title: Corredor CRM Public REST API
  description: |
    Public REST API for the Corredor CRM property management platform.

    ## Authentication

    All authenticated endpoints require a valid API key passed as a Bearer token
    in the `Authorization` header:

    ```
    Authorization: Bearer <api-key>
    ```

    API keys are scoped — certain endpoints require specific scopes such as
    `properties:write`, `contacts:write`, `leads:write`, or `webhooks:write`.

    ## Pagination

    List endpoints use cursor-based pagination. The response includes a
    `nextCursor` field; pass it as the `cursor` query parameter to fetch the
    next page. When `nextCursor` is `null`, there are no more results.

    ## Rate Limits

    Every response includes rate-limit headers:

    | Header                  | Description                          |
    |-------------------------|--------------------------------------|
    | `X-RateLimit-Limit`     | Maximum requests allowed per window  |
    | `X-RateLimit-Remaining` | Requests remaining in current window |
    | `X-RateLimit-Reset`     | Unix timestamp when the window resets|

    Limits per plan:

    | Tier                    | Requests / minute |
    |-------------------------|-------------------|
    | Unauthenticated         | 30                |
    | Basico / Solo           | 60                |
    | Profesional / Pro       | 200               |
    | Agencia                 | 600               |
    | Enterprise              | 2 000             |

    When the limit is exceeded the API responds with `429 Too Many Requests`
    and a `Retry-After` header indicating seconds to wait.

    ## Standard Response Headers

    All responses include:

    - `X-API-Version: v1`
    - `X-Request-Id: <uuid>` — unique identifier for the request
  version: 1.0.0
  contact:
    name: Corredor CRM Engineering
    url: https://corredor.ar
    email: api@corredor.ar
  license:
    name: Proprietary

servers:
  - url: https://api.corredor.ar/v1
    description: Production
  - url: http://localhost:4000/v1
    description: Development

tags:
  - name: Health
    description: Service health endpoints
  - name: Listings
    description: Public property listings (unauthenticated)
  - name: Properties
    description: Property management (authenticated)
  - name: Contacts
    description: Contact management (authenticated)
  - name: Leads
    description: Lead / deal pipeline management (authenticated)
  - name: Webhooks
    description: Webhook subscriptions (authenticated)
  - name: Portals
    description: Portal integration status (authenticated)
  - name: Auth
    description: API key introspection (authenticated)

# ──────────────────────────────────────────────────────────────────────
# Security
# ──────────────────────────────────────────────────────────────────────
security: []

# ──────────────────────────────────────────────────────────────────────
# Paths
# ──────────────────────────────────────────────────────────────────────
paths:
  # ── Health ──────────────────────────────────────────────────────────
  /health:
    get:
      operationId: getHealth
      summary: API health check
      tags: [Health]
      responses:
        "200":
          description: Service status
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, version]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-05-11T14:30:00.000Z"
                  version:
                    type: string
                    example: "1.0.0"

  # ── Listings (public) ──────────────────────────────────────────────
  /listings:
    get:
      operationId: listListings
      summary: Public property listings
      description: >
        Returns published property listings for the tenant identified by
        the `X-Tenant-Slug` header. No authentication required.
      tags: [Listings]
      parameters:
        - $ref: "#/components/parameters/XTenantSlug"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          description: Filter by property type
          schema:
            $ref: "#/components/schemas/PropertyType"
      responses:
        "200":
          description: Paginated list of listings
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Property"
                  nextCursor:
                    $ref: "#/components/schemas/NextCursor"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /listings/{id}:
    get:
      operationId: getListing
      summary: Get a single listing
      tags: [Listings]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The requested listing
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Property"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Auth ────────────────────────────────────────────────────────────
  /me:
    get:
      operationId: getMe
      summary: Current API key info
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Information about the authenticated API key
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - tenantId
                      - tenantName
                      - keyName
                      - keyPrefix
                      - scopes
                    properties:
                      tenantId:
                        type: string
                        format: uuid
                      tenantName:
                        type: string
                        example: Inmobiliaria Rivadavia
                      keyName:
                        type: string
                        example: production-key
                      keyPrefix:
                        type: string
                        example: crdr_live_abc1
                      scopes:
                        type: array
                        items:
                          type: string
                        example:
                          - "properties:read"
                          - "properties:write"
                          - "contacts:read"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Properties ──────────────────────────────────────────────────────
  /properties:
