app = "corredor-worker-prod"
primary_region = "gru"

[build]
  dockerfile = "apps/worker/Dockerfile"

[env]
  NODE_ENV = "production"
  METRICS_PORT = "9464"

# Worker does not serve HTTP traffic — no http_service block.
# Auto-stop keeps it dormant when the BullMQ queue is empty.

# Prometheus metrics endpoint — scraped by the monitoring VPS.
[[services]]
  protocol = "tcp"
  internal_port = 9464

  [[services.ports]]
    port = 9464
    handlers = []
[machine]
  auto_stop   = true
  auto_start  = true

# 2 Playwright/Chromium instances need ~450 MB each; 1024 MB gives headroom.
[[vm]]
  size   = "shared-cpu-2x"
  memory = "1024mb"
