apiVersion: 1

# Contact points and routing policies for SLA + portal sync alerts

contactPoints:
  - orgId: 1
    name: platform-email
    receivers:
      - uid: platform-email-recv
        type: email
        settings:
          addresses: "${ALERT_EMAIL_TO:-platform@corredor.ar}"
          singleEmail: false
        disableResolveMessage: false

  - orgId: 1
    name: slack-platform
    receivers:
      - uid: slack-platform-recv
        type: slack
        settings:
          url: "${SLACK_WEBHOOK_URL}"
          channel: "#alerts-platform"
          title: |
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }} 🔴{{ else }} ✅{{ end }}] {{ .CommonLabels.alertname }}
          text: |
            {{ range .Alerts }}
            *Summary:* {{ .Annotations.summary }}
            *Severity:* {{ .Labels.severity }}
            *SLA Tier:* {{ .Labels.sla_tier }}
            {{ if .Annotations.description }}*Details:* {{ .Annotations.description }}{{ end }}
            {{ if .Annotations.runbook_url }}*Runbook:* <{{ .Annotations.runbook_url }}|Open runbook>{{ end }}
            {{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: platform-email
    group_by:
      - alertname
      - sla_tier
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: slack-platform
        matchers:
          - severity =~ "critical|warning"
        group_wait: 10s
        repeat_interval: 1h
        continue: true
      - receiver: platform-email
        matchers:
          - severity = "critical"
        group_wait: 30s
        repeat_interval: 2h
