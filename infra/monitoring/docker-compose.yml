version: "3.9"

# Production monitoring stack — Prometheus + Grafana
# Deploy on a small VPS (2 vCPU / 2 GB) alongside the Fly.io workloads.
#
# Required env vars (pass via .env or secret manager):
#   GRAFANA_ADMIN_PASSWORD
#   FLY_APP_NAME_API       (e.g. corredor-api-prod)
#   FLY_APP_NAME_WORKER    (e.g. corredor-worker-prod)
#   FLY_TOKEN              (read-only Prometheus token from Fly.io dashboard)
#   SMTP_HOST / SMTP_USER / SMTP_PASSWORD / ALERT_EMAIL_TO  (for email alerts)
#   SLACK_WEBHOOK_URL      (for Slack alert channel)

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_DOMAIN: monitoring.corredor.ar
      GF_SERVER_ROOT_URL: https://monitoring.corredor.ar
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-smtp.sendgrid.net:587}
      GF_SMTP_USER: ${SMTP_USER:-apikey}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: alerts@corredor.ar
      GF_SMTP_FROM_NAME: Corredor Alerts
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
