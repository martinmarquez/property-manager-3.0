name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for staging deploy'
        required: false
        default: 'GA load test'

jobs:
  deploy-staging:
    name: Deploy API to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run staging DB migrations
        run: pnpm --filter @corredor/db migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app if not exists
        run: |
          if ! flyctl apps list | grep -q "corredor-api-staging"; then
            flyctl apps create corredor-api-staging --org corredor
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Provision staging Redis if not exists
        run: |
          if ! flyctl redis list --org corredor 2>/dev/null | grep -q "corredor-redis-staging"; then
            echo "Creating Fly Redis for staging..."
            flyctl redis create \
              --name corredor-redis-staging \
              --org corredor \
              --region gru \
              --no-replicas \
              --yes
          fi
          REDIS_URL=$(flyctl redis status corredor-redis-staging --org corredor 2>/dev/null \
            | grep -oE 'redis://[^ ]+' | head -1)
          if [ -z "$REDIS_URL" ]; then
            REDIS_URL=$(flyctl redis status corredor-redis-staging 2>/dev/null \
              | grep -oE 'rediss://[^ ]+' | head -1)
          fi
          echo "STAGING_REDIS_URL=$REDIS_URL" >> "$GITHUB_ENV"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set Fly.io secrets
        run: |
          flyctl secrets set \
            DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            ${STAGING_REDIS_URL:+REDIS_URL="$STAGING_REDIS_URL"} \
            --app corredor-api-staging --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy staging API to Fly.io
        run: flyctl deploy --config fly-api-staging.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify staging health
        run: |
          sleep 15
          curl --retry 5 --retry-delay 10 --retry-connrefused \
            https://corredor-api-staging.fly.dev/health \
            --fail --silent --show-error | jq '.'

      - name: Obtain load-test JWT and set secret
        run: |
          TOKEN=$(curl -s -X POST https://corredor-api-staging.fly.dev/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"k6@corredor.ar","password":"LoadTest2026!"}' \
            | jq -r '.token // .accessToken // .data.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "WARNING: Could not obtain load-test JWT — set STAGING_LOAD_TEST_TOKEN manually"
          else
            echo "Load-test JWT obtained successfully"
            gh secret set STAGING_LOAD_TEST_TOKEN --body "$TOKEN"
            gh secret set STAGING_API_URL --body "https://corredor-api-staging.fly.dev"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
