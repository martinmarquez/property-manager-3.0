name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for staging deploy'
        required: false
        default: 'GA load test'

jobs:
  deploy-staging:
    name: Deploy API to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run staging DB migrations
        run: pnpm --filter @corredor/db migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app if not exists
        run: |
          if ! flyctl apps list | grep -q "corredor-api-staging"; then
            flyctl apps create corredor-api-staging --org corredor
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Provision staging Redis if not exists
        continue-on-error: true
        run: |
          if ! flyctl redis list --org corredor 2>/dev/null | grep -q "corredor-redis-staging"; then
            echo "Creating Fly Redis for staging..."
            script -q /dev/null -c "printf '\n' | flyctl redis create \
              --name corredor-redis-staging \
              --org corredor \
              --region gru \
              --no-replicas \
              --enable-eviction" || true
          fi
          # Try JSON output first (newer flyctl versions)
          REDIS_URL=$(flyctl redis status corredor-redis-staging --json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((d[k] for k in ('privateUrl','PrivateUrl','private_url','Private URL','url','URL') if k in d and d[k]),''))" 2>/dev/null || true)
          # Fallback: text grep
          if [ -z "$REDIS_URL" ]; then
            REDIS_URL=$(flyctl redis status corredor-redis-staging 2>/dev/null \
              | grep -oE 'redis(s)?://[^ ]+' | head -1)
          fi
          # Fallback: use GitHub secret if set
          if [ -z "$REDIS_URL" ] && [ -n "$SECRET_REDIS_URL" ]; then
            REDIS_URL="$SECRET_REDIS_URL"
            echo "Using STAGING_REDIS_URL from repository secret"
          fi
          if [ -n "$REDIS_URL" ]; then
            echo "STAGING_REDIS_URL=$REDIS_URL" >> "$GITHUB_ENV"
            echo "Redis URL obtained"
          else
            echo "WARNING: Could not obtain Redis URL - apps will use REDIS_URL from existing Fly secrets"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SECRET_REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}

      - name: Set Fly.io secrets
        run: |
          flyctl secrets set \
            NODE_ENV="production" \
            DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            INBOX_SYNC_DELIVER="true" \
            ${STAGING_REDIS_URL:+REDIS_URL="$STAGING_REDIS_URL"} \
            --app corredor-api-staging --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy staging API to Fly.io
        run: |
          flyctl deploy --config fly-api-staging.toml --local-only --wait-timeout 300 \
            --build-arg CACHE_BUST="${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create Fly worker app if not exists
        run: |
          if ! flyctl apps list | grep -q "corredor-worker-staging"; then
            flyctl apps create corredor-worker-staging --org corredor
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set Fly.io worker secrets
        run: |
          flyctl secrets set \
            NODE_ENV="production" \
            DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            ${STAGING_REDIS_URL:+REDIS_URL="$STAGING_REDIS_URL"} \
            --app corredor-worker-staging --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy staging worker to Fly.io
        run: |
          flyctl deploy --config infra/fly/worker-staging.fly.toml --local-only --wait-timeout 300 \
            --build-arg CACHE_BUST="${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Dump Fly app logs (post-deploy diagnostic)
        continue-on-error: true
        run: flyctl logs --app corredor-api-staging --no-tail 2>&1 | tail -60
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify staging health
        run: |
          sleep 15
          curl --retry 5 --retry-delay 10 --retry-connrefused \
            https://corredor-api-staging.fly.dev/health \
            --fail --silent --show-error | jq '.'

      - name: Seed load-test data and provision API key
        run: |
          # 1. Seed tenant, user, and 1M properties (idempotent ON CONFLICT DO NOTHING)
          psql "$STAGING_DATABASE_URL" -f infra/k6/seed/seed.sql
          # 2. Derive deterministic token: HMAC-SHA256("k6-load-test", STAGING_DATABASE_URL)
          #    load-test.yml derives the same token — no GitHub secret update needed.
          RAW_KEY=$(echo -n "k6-load-test" | openssl dgst -sha256 -hmac "$STAGING_DATABASE_URL" | awk '{print $2}')
          KEY_HASH=$(echo -n "$RAW_KEY" | sha256sum | awk '{print $1}')
          psql "$STAGING_DATABASE_URL" <<SQL
            -- API key with admin scope so RBAC + requirePermission pass
            INSERT INTO api_key (id, tenant_id, created_by, key_hash, prefix, name, scopes, created_at)
            VALUES (
              'e0000000-0000-4000-8000-000000000001',
              'a0000000-0000-4000-8000-000000000001',
              'b0000000-0000-4000-8000-000000000001',
              '$KEY_HASH',
              '${RAW_KEY:0:8}',
              'k6-load-test',
              '["admin"]'::jsonb,
              NOW()
            )
            ON CONFLICT (id) DO UPDATE SET key_hash = '$KEY_HASH', scopes = '["admin"]'::jsonb, updated_at = NOW();

            -- Billing catalog: ensure plan + features exist (idempotent)
            INSERT INTO plan (code, display_name, price_usd, billing_period, is_active, sort_order)
            VALUES ('pro', 'Pro', 120.00, 'monthly', TRUE, 3)
            ON CONFLICT (code) DO NOTHING;

            INSERT INTO plan_feature (plan_code, feature_key)
            VALUES
              ('pro', 'reports_export'),
              ('pro', 'analytics_dashboard'),
              ('pro', 'ai_copilot'),
              ('pro', 'appraisals'),
              ('pro', 'site_builder')
            ON CONFLICT (plan_code, feature_key) DO NOTHING;

            -- Subscription for load-test tenant so withFeatureGate passes
            INSERT INTO subscription (id, tenant_id, plan_code, status, billing_provider, current_period_start, current_period_end, created_at)
            VALUES (
              'f0000000-0000-4000-8000-000000000001',
              'a0000000-0000-4000-8000-000000000001',
              'pro',
              'active',
              'manual',
              NOW(),
              NOW() + INTERVAL '1 year',
              NOW()
            )
            ON CONFLICT (tenant_id) DO UPDATE SET plan_code = 'pro', status = 'active', billing_provider = 'manual', updated_at = NOW();
          SQL
          echo "Load-test API key + billing seed provisioned"

          # 3. Refresh all analytics MVs so they reflect current table state.
          #    MVs are created at migration time (empty tables) and never refreshed
          #    automatically on staging. Stale/empty MVs cause slow COUNT(*) queries
          #    under concurrent load. CONCURRENTLY requires a unique index (already present).
          #    Ignore missing MVs (commission_owed depends on commission_split table).
          psql "$STAGING_DATABASE_URL" <<'REFRESH_SQL'
            DO $$
            DECLARE
              mv text;
              mvs text[] := ARRAY[
                'analytics.mv_pipeline_conversion',
                'analytics.mv_listing_performance',
                'analytics.mv_agent_productivity',
                'analytics.mv_portal_roi',
                'analytics.mv_revenue_forecast',
                'analytics.mv_retention_cohort',
                'analytics.mv_zone_heatmap',
                'analytics.mv_ai_usage_value',
                'analytics.mv_sla_adherence',
                'analytics.mv_billing_metrics'
              ];
            BEGIN
              FOREACH mv IN ARRAY mvs LOOP
                BEGIN
                  EXECUTE 'REFRESH MATERIALIZED VIEW CONCURRENTLY ' || mv;
                  RAISE NOTICE 'Refreshed %', mv;
                EXCEPTION WHEN undefined_table THEN
                  RAISE NOTICE 'Skipped % (does not exist)', mv;
                END;
              END LOOP;
            END $$;
          REFRESH_SQL
          echo "Analytics materialized views refreshed"

          # 4. Seed inbox channels + contact + conversations for 8-channel delivery test.
          #    One channel per DB type, two webchat channels (portal + webchat variants).
          #    All idempotent via ON CONFLICT DO NOTHING.
          psql "$STAGING_DATABASE_URL" <<'INBOX_SQL'
            -- Test contact for inbox conversations
            INSERT INTO contact (id, tenant_id, kind, first_name, last_name, phones, emails)
            VALUES (
              'c0000000-0000-4000-8000-000000000001',
              'a0000000-0000-4000-8000-000000000001',
              'person',
              'Test', 'Contact',
              '[{"e164":"+5491112345678","primary":true}]'::jsonb,
              '[{"address":"test@corredor-test.internal","primary":true}]'::jsonb
            )
            ON CONFLICT (id) DO NOTHING;

            -- Inbox channels (one per channel sub-type for the 8-channel test)
            INSERT INTO inbox_channel (id, tenant_id, type, name, status)
            VALUES
              ('d0000000-0000-4000-8000-000000000001', 'a0000000-0000-4000-8000-000000000001', 'email',     'email gmail',    'active'),
              ('d0000000-0000-4000-8000-000000000002', 'a0000000-0000-4000-8000-000000000001', 'email',     'email outlook',  'active'),
              ('d0000000-0000-4000-8000-000000000003', 'a0000000-0000-4000-8000-000000000001', 'email',     'email imap',     'active'),
              ('d0000000-0000-4000-8000-000000000004', 'a0000000-0000-4000-8000-000000000001', 'whatsapp',  'whatsapp',       'active'),
              ('d0000000-0000-4000-8000-000000000005', 'a0000000-0000-4000-8000-000000000001', 'sms',       'sms',            'active'),
              ('d0000000-0000-4000-8000-000000000006', 'a0000000-0000-4000-8000-000000000001', 'webchat',   'portal',         'active'),
              ('d0000000-0000-4000-8000-000000000007', 'a0000000-0000-4000-8000-000000000001', 'webchat',   'webchat',        'active'),
              ('d0000000-0000-4000-8000-000000000008', 'a0000000-0000-4000-8000-000000000001', 'instagram', 'instagram',      'active')
            ON CONFLICT DO NOTHING;

            -- Open conversations (one per channel)
            INSERT INTO conversation (id, tenant_id, channel_id, contact_id, status)
            VALUES
              ('e0000000-0000-4000-8000-000000000001', 'a0000000-0000-4000-8000-000000000001', 'd0000000-0000-4000-8000-000000000001', 'c0000000-0000-4000-8000-000000000001', 'open'),
              ('e0000000-0000-4000-8000-000000000002', 'a0000000-0000-4000-8000-000000000001', 'd0000000-0000-4000-8000-000000000002', 'c0000000-0000-4000-8000-000000000001', 'open'),
              ('e0000000-0000-4000-8000-000000000003', 'a0000000-0000-4000-8000-000000000001', 'd0000000-0000-4000-8000-000000000003', 'c0000000-0000-4000-8000-000000000001', 'open'),
              ('e0000000-0000-4000-8000-000000000004', 'a0000000-0000-4000-8000-000000000001', 'd0000000-0000-4000-8000-000000000004', 'c0000000-0000-4000-8000-000000000001', 'open'),
              ('e0000000-0000-4000-8000-000000000005', 'a0000000-0000-4000-8000-000000000001', 'd0000000-0000-4000-8000-000000000005', 'c0000000-0000-4000-8000-000000000001', 'open'),
              ('e0000000-0000-4000-8000-000000000006', 'a0000000-0000-4000-8000-000000000001', 'd0000000-0000-4000-8000-000000000006', 'c0000000-0000-4000-8000-000000000001', 'open'),
              ('e0000000-0000-4000-8000-000000000007', 'a0000000-0000-4000-8000-000000000001', 'd0000000-0000-4000-8000-000000000007', 'c0000000-0000-4000-8000-000000000001', 'open'),
              ('e0000000-0000-4000-8000-000000000008', 'a0000000-0000-4000-8000-000000000001', 'd0000000-0000-4000-8000-000000000008', 'c0000000-0000-4000-8000-000000000001', 'open')
            ON CONFLICT (id) DO NOTHING;
          INBOX_SQL
          echo "Inbox channels + conversations seeded"
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
