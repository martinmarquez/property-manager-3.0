name: Nightly Regression

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:

jobs:
  regression:
    name: Full E2E Regression (production)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production secrets
        id: prod-secrets
        run: |
          if [ -n "$BASE_URL" ] && [ -n "$E2E_USER_EMAIL" ] && [ -n "$E2E_USER_PASSWORD" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production secrets not configured — skipping nightly E2E regression. Set PRODUCTION_WEB_URL, E2E_USER_EMAIL, and E2E_USER_PASSWORD repository secrets to enable."
          fi
        env:
          BASE_URL: ${{ secrets.PRODUCTION_WEB_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Install Playwright browsers
        if: steps.prod-secrets.outputs.has_secrets == 'true'
        run: pnpm --filter @corredor/web exec playwright install chromium --with-deps

      - name: Run full Playwright suite
        if: steps.prod-secrets.outputs.has_secrets == 'true'
        run: pnpm --filter @corredor/web test:e2e
        env:
          BASE_URL: ${{ secrets.PRODUCTION_WEB_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          PLAYWRIGHT_PRODUCTION: 'true'

      - name: Upload Playwright report
        if: always() && steps.prod-secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 30
