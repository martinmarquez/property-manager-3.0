name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Run DB migrations
        run: |
          if [ -n "$DATABASE_URL" ]; then
            pnpm --filter @corredor/db migrate
          fi
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: Test
        run: pnpm turbo test
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.CI_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: Build
        run: pnpm turbo build

      - name: Bundle budget check (< 250 KB gzip)
        run: |
          set -e
          DIST=apps/web/dist/assets
          if [ ! -d "$DIST" ]; then
            echo "No dist/assets found — skipping budget check"
            exit 0
          fi
          # Sum only the JS files that are part of the initial render graph.
          # index-*.js is the entry chunk; react-*.js and router-*.js are eagerly loaded.
          ENTRY_PATTERN="^(index|react|router)-[a-f0-9]+\\.js$"
          TOTAL_BYTES=0
          for f in "$DIST"/*.js; do
            base=$(basename "$f")
            if echo "$base" | grep -qE "$ENTRY_PATTERN"; then
              SZ=$(gzip -c "$f" | wc -c)
              TOTAL_BYTES=$((TOTAL_BYTES + SZ))
              echo "  $base: $(( SZ / 1024 )) KB gzip"
            fi
          done
          TOTAL_KB=$((TOTAL_BYTES / 1024))
          echo "Initial JS bundle: ${TOTAL_KB} KB gzip (budget: 250 KB)"
          if [ "$TOTAL_BYTES" -gt $((250 * 1024)) ]; then
            echo "❌ Bundle exceeds 250 KB gzip budget (${TOTAL_KB} KB)"
            exit 1
          fi
          echo "✅ Bundle within budget"
